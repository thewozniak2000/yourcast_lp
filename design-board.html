  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #18160f;
      -webkit-font-smoothing: antialiased;
      font-family: 'Outfit', ui-sans-serif, system-ui, sans-serif;
      color: #faf7f2;
      min-height: 100vh;
    }
    #root { isolation: isolate; }

    .yc-ph-light::placeholder { color: rgba(45,41,38,0.38); }
    .yc-ph-dark::placeholder  { color: rgba(250,247,242,0.38); }

    @keyframes pillDrift {
      0%,100% { transform: translateY(0px); opacity: 1; }
      30%      { transform: translateY(-4px); opacity: 0.85; }
      65%      { transform: translateY(2px); opacity: 0.95; }
    }
    @keyframes waveBar {
      0%, 100% { transform: scaleY(0.28); }
      50%       { transform: scaleY(1); }
    }
    @keyframes slideUpSheet {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    @keyframes slideDownSheet {
      from { transform: translateY(0); }
      to   { transform: translateY(100%); }
    }
    @keyframes playPulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.08); }
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.3; transform: scale(0.65); }
    }

    a { color: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    /* ── Topbar ── */
    .board-topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(18, 14, 10, 0.92);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      backdrop-filter: blur(20px) saturate(140%);
      border-bottom: 1px solid rgba(250, 247, 242, 0.08);
      padding: 0 40px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .board-logo {
      display: flex;
      align-items: baseline;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .board-logo-serif {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      color: #c4654a;
    }
    .board-badge {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(250, 247, 242, 0.32);
      padding: 3px 8px;
      border: 1px solid rgba(250, 247, 242, 0.12);
      border-radius: 999px;
    }

    /* ── Tab nav ── */
    .board-tabs {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(250, 247, 242, 0.06);
      border-radius: 8px;
      padding: 3px;
    }
    .board-tab {
      font-size: 12px;
      font-weight: 400;
      color: rgba(250, 247, 242, 0.45);
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      border: none;
      background: transparent;
      font-family: 'Outfit', sans-serif;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .board-tab:hover { color: rgba(250, 247, 242, 0.75); }
    .board-tab.active { background: rgba(250, 247, 242, 0.12); color: #faf7f2; }

    /* ── DS sub-nav ── */
    .ds-subnav {
      position: sticky;
      top: 56px;
      z-index: 90;
      background: rgba(18, 14, 10, 0.88);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(250, 247, 242, 0.05);
      padding: 0 64px;
      height: 40px;
      display: flex;
      align-items: center;
      gap: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .ds-subnav::-webkit-scrollbar { display: none; }
    .ds-subnav-link {
      font-size: 11px;
      font-weight: 400;
      color: rgba(250, 247, 242, 0.35);
      padding: 0 14px;
      height: 40px;
      display: flex;
      align-items: center;
      cursor: pointer;
      white-space: nowrap;
      border: none;
      background: transparent;
      font-family: 'Outfit', sans-serif;
      letter-spacing: 0.04em;
      transition: color 0.15s;
      text-decoration: none;
    }
    .ds-subnav-link:hover { color: rgba(250, 247, 242, 0.75); }
    .ds-subnav-link.active { color: #c4654a; }

    /* ── Screens canvas ── */
    .board-canvas {
      padding: 48px 48px 80px;
      display: flex;
      gap: 48px;
      align-items: flex-start;
      overflow-x: auto;
      min-height: calc(100vh - 56px);
    }
    .board-screen-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
    }
    .board-screen-name {
      font-size: 13px;
      font-weight: 500;
      color: rgba(250, 247, 242, 0.85);
      margin-bottom: 3px;
      text-align: center;
    }
    .board-screen-code {
      font-size: 11px;
      font-weight: 300;
      color: rgba(250, 247, 242, 0.32);
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      text-align: center;
    }
    .board-divider {
      width: 1px;
      background: rgba(250, 247, 242, 0.06);
      align-self: stretch;
      flex-shrink: 0;
      margin: 0 4px;
    }

    /* ── Design System page ── */
    .ds-page {
      padding: 64px 64px 120px;
      max-width: 960px;
    }

    /* Section structure */
    .ds-section {
      margin-bottom: 80px;
      scroll-margin-top: 96px;
    }
    .ds-eyebrow {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(196, 101, 74, 0.7);
      margin-bottom: 6px;
    }
    .ds-section-title {
      font-size: 26px;
      font-weight: 300;
      color: #faf7f2;
      margin-bottom: 8px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
    }
    .ds-section-desc {
      font-size: 13px;
      font-weight: 300;
      color: rgba(250, 247, 242, 0.42);
      margin-bottom: 32px;
      line-height: 1.7;
      max-width: 560px;
    }
    .ds-rule { height: 1px; background: rgba(250,247,242,0.06); margin-bottom: 80px; }

    /* Token table */
    .ds-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .ds-table th {
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(250,247,242,0.28);
      padding: 8px 12px;
      border-bottom: 1px solid rgba(250,247,242,0.06);
    }
    .ds-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(250,247,242,0.04);
      vertical-align: middle;
    }
    .ds-table tr:last-child td { border-bottom: none; }
    .ds-table .mono {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 11px;
      color: rgba(250,247,242,0.65);
    }
    .ds-table .usage {
      font-size: 11px;
      color: rgba(250,247,242,0.35);
    }

    /* Demo area */
    .ds-demo {
      background: rgba(250,247,242,0.03);
      border: 1px solid rgba(250,247,242,0.07);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 24px;
    }
    .ds-demo-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(250,247,242,0.2);
      margin-bottom: 16px;
    }
    .ds-demo-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-start;
    }
    .ds-demo-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Swatch */
    .ds-swatch-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
    .ds-swatch { display: flex; flex-direction: column; gap: 8px; width: 110px; }
    .ds-swatch-box { width: 110px; height: 72px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); }
    .ds-swatch-name { font-size: 12px; font-weight: 500; color: rgba(250,247,242,0.8); }
    .ds-swatch-hex { font-size: 11px; font-weight: 300; color: rgba(250,247,242,0.38); font-family: ui-monospace,'SF Mono',Menlo,monospace; }
    .ds-swatch-role { font-size: 10px; font-weight: 300; color: rgba(250,247,242,0.25); line-height: 1.4; }

    /* Opacity strip */
    .ds-opacity-row { display: flex; gap: 4px; margin-bottom: 16px; }
    .ds-opacity-cell { flex: 1; height: 40px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .ds-opacity-val { font-size: 9px; font-weight: 500; font-family: ui-monospace,monospace; }

    /* Type specimens */
    .ds-type-row { padding: 16px 0; border-bottom: 1px solid rgba(250,247,242,0.05); }
    .ds-type-row:last-child { border-bottom: none; }
    .ds-type-meta { font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(250,247,242,0.25); font-family: ui-monospace,monospace; margin-bottom: 6px; }

    /* Spacing bars */
    .ds-space-row { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
    .ds-space-bar { background: rgba(196,101,74,0.3); height: 18px; border-radius: 3px; flex-shrink: 0; }
    .ds-space-token { font-size: 11px; font-family: ui-monospace,monospace; color: rgba(250,247,242,0.55); min-width: 64px; }
    .ds-space-val { font-size: 11px; color: rgba(250,247,242,0.3); min-width: 36px; }

    /* Radius items */
    .ds-radius-grid { display: flex; gap: 16px; flex-wrap: wrap; }
    .ds-radius-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .ds-radius-box { width: 72px; height: 72px; background: rgba(250,247,242,0.06); border: 1px solid rgba(250,247,242,0.1); }
    .ds-radius-lbl { font-size: 11px; color: rgba(250,247,242,0.55); text-align: center; }
    .ds-radius-val-lbl { font-size: 10px; color: rgba(250,247,242,0.25); font-family: ui-monospace,monospace; text-align: center; }

    /* Shadow items */
    .ds-shadow-item { display: flex; align-items: center; gap: 20px; padding: 14px 0; border-bottom: 1px solid rgba(250,247,242,0.04); }
    .ds-shadow-item:last-child { border-bottom: none; }
    .ds-shadow-box { width: 56px; height: 36px; background: rgba(250,247,242,0.08); border-radius: 8px; flex-shrink: 0; }
    .ds-shadow-info { flex: 1; }
    .ds-shadow-token { font-size: 12px; font-weight: 500; color: rgba(250,247,242,0.7); margin-bottom: 3px; }
    .ds-shadow-value { font-size: 10px; font-family: ui-monospace,monospace; color: rgba(250,247,242,0.3); }

    /* Motion token rows */
    .ds-motion-row { display: flex; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid rgba(250,247,242,0.04); }
    .ds-motion-row:last-child { border-bottom: none; }

    /* Gradient items */
    .ds-grad-item { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid rgba(250,247,242,0.04); }
    .ds-grad-item:last-child { border-bottom: none; }
    .ds-grad-box { width: 80px; height: 48px; border-radius: 6px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.06); }
    .ds-grad-info { flex: 1; min-width: 0; }
    .ds-grad-name { font-size: 12px; font-weight: 500; color: rgba(250,247,242,0.7); margin-bottom: 3px; }
    .ds-grad-value { font-size: 10px; font-family: ui-monospace,monospace; color: rgba(250,247,242,0.28); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Anim demo */
    .ds-anim-demo { display: flex; gap: 24px; flex-wrap: wrap; }
    .ds-anim-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .ds-anim-label { font-size: 10px; color: rgba(250,247,242,0.3); text-align: center; font-family: ui-monospace,monospace; }

    /* ── Prototype tab ── */
    .proto-stage {
      min-height: calc(100vh - 56px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 56px 24px 80px;
      gap: 48px;
    }
    .proto-main { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .proto-inner { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .proto-screen { position: absolute; inset: 0; }
    .proto-screen.entering-push  { animation: protoSlideInRight 0.30s cubic-bezier(0.32,0.72,0,1) both; }
    .proto-screen.exiting-push   { animation: protoSlideOutLeft  0.30s cubic-bezier(0.32,0.72,0,1) both; }
    .proto-screen.entering-pop   { animation: protoSlideInLeft   0.30s cubic-bezier(0.32,0.72,0,1) both; }
    .proto-screen.exiting-pop    { animation: protoSlideOutRight 0.30s cubic-bezier(0.32,0.72,0,1) both; }
    .proto-screen.entering-sheet { animation: protoSlideInUp     0.32s cubic-bezier(0.32,0.72,0,1) both; }
    .proto-screen.exiting-sheet  { animation: protoSlideOutDown  0.24s cubic-bezier(0.32,0.72,0,1) both; }
    .proto-screen.entering-fade  { animation: protoFadeIn  0.22s ease-out both; }
    .proto-screen.exiting-fade   { animation: protoFadeOut 0.18s ease-in  both; }
    @keyframes protoSlideInRight  { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes protoSlideOutLeft  { from { transform: translateX(0); }    to { transform: translateX(-28%); } }
    @keyframes protoSlideInLeft   { from { transform: translateX(-28%); } to { transform: translateX(0); } }
    @keyframes protoSlideOutRight { from { transform: translateX(0); }    to { transform: translateX(100%); } }
    @keyframes protoSlideInUp     { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes protoSlideOutDown  { from { transform: translateY(0); }    to { transform: translateY(100%); } }
    @keyframes protoFadeIn        { from { opacity: 0; } to { opacity: 1; } }
    @keyframes protoFadeOut       { from { opacity: 1; } to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .proto-screen { animation: none !important; } }
    .proto-hotspot {
      position: absolute; cursor: pointer; z-index: 20; border-radius: 6px;
      transition: background 0.12s;
    }
    .proto-hotspot:hover { background: rgba(196,101,74,0.16); }
    .proto-hotspot-reveal {
      border: 1.5px solid rgba(196,101,74,0.55) !important;
      background: rgba(196,101,74,0.1) !important;
    }
    .proto-hotspot-lbl {
      position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
      font-size: 7px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: rgba(196,101,74,0.9); white-space: nowrap; pointer-events: none;
    }
    .proto-controls {
      display: flex; align-items: center; gap: 8px;
      background: rgba(250,247,242,0.04); border: 1px solid rgba(250,247,242,0.07);
      border-radius: 12px; padding: 8px 14px;
    }
    .proto-ctrl-btn {
      font-size: 11px; font-weight: 400; color: rgba(250,247,242,0.5);
      background: rgba(250,247,242,0.05); border: 1px solid rgba(250,247,242,0.09);
      border-radius: 7px; padding: 5px 11px; cursor: pointer;
      font-family: 'Outfit', sans-serif; transition: color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .proto-ctrl-btn:hover { color: #faf7f2; background: rgba(250,247,242,0.1); }
    .proto-ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .proto-ctrl-btn.on { color: #c4654a; border-color: rgba(196,101,74,0.3); background: rgba(196,101,74,0.08); }
    .proto-ctrl-screen { font-size: 12px; font-weight: 500; color: rgba(250,247,242,0.75); min-width: 110px; text-align: center; }
    .proto-ctrl-sep { width: 1px; height: 14px; background: rgba(250,247,242,0.09); flex-shrink: 0; }
    .proto-sidebar { padding-top: 0; display: flex; flex-direction: column; gap: 6px; width: 196px; flex-shrink: 0; }
    .proto-sidebar-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(250,247,242,0.2); padding: 0 10px; margin-bottom: 6px; }
    .proto-flow-node {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border-radius: 8px; background: rgba(250,247,242,0.03); border: 1px solid transparent;
      cursor: pointer; transition: all 0.15s;
    }
    .proto-flow-node:hover { background: rgba(250,247,242,0.06); }
    .proto-flow-node.cur { background: rgba(196,101,74,0.09); border-color: rgba(196,101,74,0.22); }
    .proto-flow-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(250,247,242,0.18); flex-shrink: 0; }
    .proto-flow-node.cur .proto-flow-dot { background: #c4654a; }
    .proto-flow-name { font-size: 12px; font-weight: 400; color: rgba(250,247,242,0.5); }
    .proto-flow-node.cur .proto-flow-name { color: rgba(250,247,242,0.92); }
    .proto-flow-code { font-size: 9.5px; color: rgba(250,247,242,0.22); font-family: ui-monospace,monospace; margin-top: 1px; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const { PhoneFrame, ScreenPlayerHero, ScreenTopicPicker, ScreenHomeFeed,
            ScreenFeedback, ScreenPodcastConfig, ScreenSegmentModal } = window;

    /* ─── Token data ─── */
    const UI = "'Outfit', sans-serif";
    const ED = "'Cormorant Garamond', serif";

    const PRIMITIVE_COLORS = [
      { name: 'Coral',    token: 'coral',    hex: '#c4654a', role: 'Primary accent · CTA · highlights' },
      { name: 'Cream',    token: 'cream',    hex: '#faf7f2', role: 'Light bg · text on dark · logo' },

      { name: 'Ink',      token: 'ink',      hex: '#1c1917', role: 'Deepest dark · footer bg' },
      { name: 'Dark',     token: 'dark',     hex: '#141210', role: 'Darkest bg · pricing dark' },
      { name: 'Card',     token: 'card',     hex: '#1e1b18', role: 'Dark card surface' },
      { name: 'Stone',    token: 'stone',    hex: '#f0ebe4', role: 'Light section bg' },

      { name: 'Sage',     token: 'sage',     hex: '#6b7c6e', role: 'Muted green · subtle accents' },

    const SEMANTIC_TOKENS = [
      { role: 'bg-base',          dark: '#0f0d0a',              light: 'cream (#faf7f2)',      usage: 'App screen backgrounds' },
      { role: 'bg-surface',       dark: '#1a1510',              light: '#ffffff',              usage: 'Cards, feed items' },

                    <rect x="2" y="2" width="16" height="8" rx="2" fill="rgba(250,247,242,0.9)"/>
                    <path d="M23 4.5V7.5C23.8 7.2 24.5 6.7 24.5 6C24.5 5.3 23.8 4.8 23 4.5Z" fill="rgba(250,247,242,0.4)"/>
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ── 09 Gradients ── */
    function GradientsSection() {
      return (
        <div id="gradients" className="ds-section">
          <div className="ds-eyebrow">09 · Gradient Library</div>
          <div className="ds-section-title">7 named gradients</div>
          <div className="ds-section-desc">All gradients serve a functional purpose — fading, scrims, atmosphere, modal surfaces. No decorative gradients. Each can be referenced by name in future components.</div>
          <div className="ds-demo">
            {GRADIENTS.map(g => (
              <div key={g.name} className="ds-grad-item">
                <div className="ds-grad-box" style={{ background: g.value }} />
                <div className="ds-grad-info">
                  <div className="ds-grad-name">{g.name}</div>
                  <div className="ds-grad-value">{g.value}</div>
                  <div style={{ fontFamily: "'Outfit',sans-serif", fontSize: 10, color: 'rgba(250,247,242,0.28)', marginTop: 3 }}>{g.usage}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ── Design System page root ── */
    function DesignSystemPage() {
      const [activeSection, setActiveSection] = useState('brand');

      useEffect(() => {
        const observer = new IntersectionObserver(entries => {
          entries.forEach(e => { if (e.isIntersecting) setActiveSection(e.target.id); });
        }, { rootMargin: '-20% 0px -70% 0px' });
        DS_SECTIONS.forEach(s => {
          const el = document.getElementById(s.id);
          if (el) observer.observe(el);
        });
        return () => observer.disconnect();
      }, []);

      return (
        <div>
          {/* Sub-nav */}
          <div className="ds-subnav">
            {DS_SECTIONS.map(s => (
              <a key={s.id} href={`#${s.id}`} className={`ds-subnav-link${activeSection === s.id ? ' active' : ''}`}>
                {s.label}
              </a>
            ))}
          </div>
          <div className="ds-page">
            <BrandSection />
            <div className="ds-rule" />
            <ColorsSection />
            <div className="ds-rule" />
            <TypeSection />
            <div className="ds-rule" />
            <SpacingSection />
            <div className="ds-rule" />
            <RadiusSection />
            <div className="ds-rule" />
            <ElevationSection />
            <div className="ds-rule" />
            <MotionSection />
            <div className="ds-rule" />
            <ComponentsSection />
            <div className="ds-rule" />
            <GradientsSection />
          </div>
        </div>
      );
    }

    /* ─── Prototype tab ─── */
    const PROTO_FLOW = {
      home: {
        component: ScreenHomeFeed, name: 'Home Feed', code: 'ScreenHomeFeed',
        hotspots: [
          { top:'2%',  left:'82%', width:'15%', height:'6.5%', to:'config',  transition:'push', label:'Settings' },
          { top:'15%', left:'3%',  width:'94%', height:'21%',  to:'player',  transition:'push', label:'Episode 1' },
          { top:'38%', left:'3%',  width:'94%', height:'21%',  to:'player',  transition:'push', label:'Episode 2' },
          { top:'61%', left:'3%',  width:'94%', height:'21%',  to:'player',  transition:'push', label:'Episode 3' },
        ]
      },
      player: {
        component: ScreenPlayerHero, name: 'Hero Player', code: 'ScreenPlayerHero',
        hotspots: [
          { top:'2.5%', left:'1%',  width:'13%', height:'6%',  to:'home',     transition:'pop',   label:'Back' },
          { top:'55%',  left:'60%', width:'36%', height:'9%',  to:'feedback', transition:'sheet', label:'Feedback' },
          { top:'70%',  left:'8%',  width:'84%', height:'8%',  to:'segment',  transition:'fade',  label:'Segment' },
        ]
      },
      feedback: {
        component: ScreenFeedback, name: 'Feedback', code: 'ScreenFeedback',
        hotspots: [
          { top:'36%', left:'84%', width:'12%', height:'5.5%', to:'player', transition:'pop', label:'Close' },
          { top:'82%', left:'8%',  width:'84%', height:'7%',   to:'player', transition:'pop', label:'Done' },
        ]
      },
      segment: {
        component: ScreenSegmentModal, name: 'Segment Modal', code: 'ScreenSegmentModal',
        hotspots: [
          { top:'22%', left:'84%', width:'12%', height:'5.5%', to:'player', transition:'fade', label:'Close' },
        ]
      },
      config: {
        component: ScreenPodcastConfig, name: 'Podcast Config', code: 'ScreenPodcastConfig',
        hotspots: [
          { top:'2.5%', left:'1%',  width:'13%', height:'6%',  to:'home',   transition:'pop',  label:'Back' },
          { top:'42%',  left:'3%',  width:'94%', height:'30%', to:'topics', transition:'push', label:'Topics' },
          { top:'84%',  left:'8%',  width:'84%', height:'7%',  to:'player', transition:'push', label:'Save' },
        ]
      },
      topics: {
        component: ScreenTopicPicker, name: 'Topic Picker', code: 'ScreenTopicPicker',
        hotspots: [
          { top:'3%', left:'1%', width:'12%', height:'5.5%', to:'config', transition:'pop', label:'Back' },
        ]
      },
    };

    const PROTO_NODES = [
      { id:'home',     name:'Home Feed',     code:'ScreenHomeFeed' },
      { id:'player',   name:'Hero Player',   code:'ScreenPlayerHero' },
      { id:'feedback', name:'Feedback',      code:'ScreenFeedback' },
      { id:'segment',  name:'Segment Modal', code:'ScreenSegmentModal' },
      { id:'config',   name:'Podcast Config',code:'ScreenPodcastConfig' },
      { id:'topics',   name:'Topic Picker',  code:'ScreenTopicPicker' },
    ];

    function PrototypeRunner() {
      const [current, setCurrent]         = useState('home');
      const [history, setHistory]         = useState([]);
      const [transitioning, setTrans]     = useState(false);
      const [fromScreen, setFromScreen]   = useState(null);
      const [animType, setAnimType]       = useState('push');
      const [showHotspots, setShowHS]     = useState(false);
      const timerRef = useRef(null);

      const DURATION = 330;

      const doNavigate = useCallback((to, type, newHistory) => {
        if (transitioning) return;
        setFromScreen(current);
        setAnimType(type);
        setHistory(newHistory);
        setCurrent(to);
        setTrans(true);
        timerRef.current = setTimeout(() => {
          setTrans(false);
          setFromScreen(null);
        }, DURATION);
      }, [current, transitioning]);

      const navigate = (to, type) => doNavigate(to, type, [...history, current]);

      const goBack = () => {
        if (history.length === 0 || transitioning) return;
        const prev = history[history.length - 1];
        doNavigate(prev, 'pop', history.slice(0, -1));
      };

      const reset = () => {
        if (timerRef.current) clearTimeout(timerRef.current);
        setTrans(false); setFromScreen(null);
        setCurrent('home'); setHistory([]); setAnimType('push');
      };

      const jumpTo = (id) => {
        if (timerRef.current) clearTimeout(timerRef.current);
        setTrans(false); setFromScreen(null);
        setCurrent(id); setHistory([]); setAnimType('push');
      };

      useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);

      const flow = PROTO_FLOW[current];
      const FromComp = fromScreen ? PROTO_FLOW[fromScreen].component : null;
      const CurComp  = flow.component;

      return (
        <div className="proto-stage">
          <div className="proto-main">
            {/* Controls */}
            <div className="proto-controls">
              <button className="proto-ctrl-btn" onClick={goBack} disabled={history.length === 0 || transitioning}>← Back</button>
              <div className="proto-ctrl-sep" />
              <div className="proto-ctrl-screen">{flow.name}</div>
              <div className="proto-ctrl-sep" />
              <button className={`proto-ctrl-btn${showHotspots ? ' on' : ''}`} onClick={() => setShowHS(s => !s)}>Hotspots</button>
              <button className="proto-ctrl-btn" onClick={reset}>⟲ Restart</button>
            </div>

            {/* Phone */}
            <PhoneFrame width={300}>
              <div className="proto-inner">
                {transitioning && FromComp && (
                  <div className={`proto-screen exiting-${animType}`}>
                    <FromComp />
                  </div>
                )}
                <div className={transitioning ? `proto-screen entering-${animType}` : 'proto-screen'}>
                  <CurComp />
                  {flow.hotspots.map(h => (
                    <div
                      key={h.label}
                      className={`proto-hotspot${showHotspots ? ' proto-hotspot-reveal' : ''}`}
                      style={{ top: h.top, left: h.left, width: h.width, height: h.height }}
                      onClick={() => navigate(h.to, h.transition)}
                      title={`→ ${h.label}`}
                    >
                      {showHotspots && <span className="proto-hotspot-lbl">{h.label}</span>}
                    </div>
                  ))}
                </div>
              </div>
            </PhoneFrame>

            <div style={{ fontSize:'11px', color:'rgba(250,247,242,0.2)', textAlign:'center', maxWidth:300 }}>
              {showHotspots ? 'Coral outlines = tappable navigation zones' : 'Tap elements to navigate · enable Hotspots to see zones'}
            </div>
          </div>

          {/* Sidebar flow map */}
          <div className="proto-sidebar">
            <div className="proto-sidebar-label">Screens</div>
            {PROTO_NODES.map(node => (
              <div key={node.id} className={`proto-flow-node${current === node.id ? ' cur' : ''}`} onClick={() => jumpTo(node.id)}>
                <div className="proto-flow-dot" />
                <div>
                  <div className="proto-flow-name">{node.name}</div>
                  <div className="proto-flow-code">{node.code}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ─── Board root ─── */
    function BoardApp() {
      const [tab, setTab] = useState('screens');
      return (
        <div>
          <div className="board-topbar">
            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <div className="board-logo">
                your<span className="board-logo-serif">cast</span>
              </div>
              <div className="board-badge">design board</div>
            </div>
            <div className="board-tabs">
              <button className={`board-tab${tab === 'screens' ? ' active' : ''}`} onClick={() => setTab('screens')}>Screens</button>
              <button className={`board-tab${tab === 'ds' ? ' active' : ''}`} onClick={() => setTab('ds')}>Design System</button>
              <button className={`board-tab${tab === 'proto' ? ' active' : ''}`} onClick={() => setTab('proto')}>Prototype</button>
            </div>
            <div style={{ fontSize: '12px', fontWeight: 300, color: 'rgba(250,247,242,0.28)', minWidth: 80, textAlign: 'right' }}>
              {tab === 'screens' ? `${SCREENS.length} screens` : tab === 'ds' ? '9 sections' : 'click-through'}
            </div>
          </div>

          {tab === 'screens' ? (
            <div className="board-canvas">
              {SCREENS.map((s, i) => (
                <React.Fragment key={s.code}>
                  <div className="board-screen-slot">
                    <PhoneFrame width={s.width}><s.component /></PhoneFrame>
                    <div style={{ textAlign: 'center' }}>
                      <div className="board-screen-name">{s.name}</div>
                      <div className="board-screen-code">{s.code}</div>
                      <div style={{ fontSize: '10px', fontWeight: 300, color: 'rgba(250,247,242,0.38)', marginTop: 3 }}>{s.desc}</div>
                    </div>
                  </div>
                  {i < SCREENS.length - 1 && <div className="board-divider" />}
                </React.Fragment>
              ))}
            </div>
          ) : tab === 'ds' ? (
            <DesignSystemPage />
          ) : (
            <PrototypeRunner />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('board-root')).render(<BoardApp />);
  </script>
</body>
</html>
